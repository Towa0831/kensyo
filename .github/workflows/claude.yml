name: Claude Code
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 画像の受け取りフォルダを用意する
        run: mkdir -p /tmp/github-images /tmp/issue-images

      - name: Issueに添付された画像をダウンロードする
        if: github.event_name != 'pull_request_review_comment'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          python3 - <<'PY'
          import html, json, os, re, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          issue_no = os.environ["ISSUE_NUMBER"]
          comment_id = os.environ.get("COMMENT_ID", "")
          out_dir = "/tmp/issue-images"
          os.makedirs(out_dir, exist_ok=True)

          def api(path):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github.full+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "issue-image-fetcher"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          def ext_of(data):
              if data[:8] == b"\x89PNG\r\n\x1a\n":
                  return ".png"
              if data[:3] == b"\xff\xd8\xff":
                  return ".jpg"
              if data[:4] == b"GIF8":
                  return ".gif"
              if data[:4] == b"RIFF" and data[8:12] == b"WEBP":
                  return ".webp"
              if b"<svg" in data[:1000]:
                  return ".svg"
              return None

          GUID = re.compile(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}", re.I)
          ORIGINAL = re.compile(
              r"https://github\.com/user-attachments/assets/[0-9A-Za-z-]+"
              r"|https://(?:private-)?user-images\.githubusercontent\.com/[^\s\"'<>)]+"
          )
          SIGNED = re.compile(r"https://private-user-images\.githubusercontent\.com/[^\s\"'<>]+")

          sources = []
          try:
              sources.append(("Issue本文", api(f"issues/{issue_no}")))
          except Exception as e:
              print(f"Issue本文を取得できませんでした: {e}")
          if comment_id:
              try:
                  sources.append(("コメント", api(f"issues/comments/{comment_id}")))
              except Exception as e:
                  print(f"コメントを取得できませんでした: {e}")

          lines, seen, count = [], set(), 0
          for label, item in sources:
              body = item.get("body") or ""
              signed = SIGNED.findall(html.unescape(item.get("body_html") or ""))
              for url in ORIGINAL.findall(body):
                  m = GUID.search(url)
                  key = m.group(0).lower() if m else url
                  if key in seen:
                      continue
                  seen.add(key)
                  candidates = [s for s in signed if m and key in s.lower()] + [url]
                  data = None
                  for c in candidates:
                      try:
                          d = fetch(c)
                          if ext_of(d):
                              data = d
                              break
                      except Exception as e:
                          print(f"取得に失敗: {c[:80]}... ({e})")
                  if data is None:
                      print(f"✗ ダウンロードできませんでした: {url}")
                      continue
                  count += 1
                  name = f"image-{count}{ext_of(data)}"
                  with open(os.path.join(out_dir, name), "wb") as f:
                      f.write(data)
                  lines.append(f"{name}\t{label}\t{url}")
                  print(f"✓ {name} を保存しました（{label}）")

          with open(os.path.join(out_dir, "list.txt"), "w", encoding="utf-8") as f:
              f.write("ファイル名\t貼られていた場所\t元のURL\n")
              f.write("\n".join(lines) + "\n")
          print(f"合計 {count} 枚の画像を /tmp/issue-images/ に保存しました")
          PY

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(cp:*),Bash(mkdir:*),Bash(ls:*)"
            --add-dir /tmp/issue-images
            --add-dir /tmp/github-images
